name: Port flows.json changes to Go

# Same trigger as docker-build.yml — a bump to image:tag is this repo's
# signal for "a new release of the reference implementation just
# happened." Reusing it (rather than triggering on every flows.json
# commit) keeps the Go port aligned to actual releases, not every
# in-progress edit.
on:
  push:
    paths:
      - 'image:tag'
  workflow_dispatch:   # for testing this workflow on its own before trusting the real trigger

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write   # lets the trigger job dispatch this workflow

jobs:
  # claude-code-action rejects the `push` event ("Unsupported event type: push"),
  # so a push only re-dispatches this workflow; the real work runs under
  # workflow_dispatch, which the action supports.
  trigger:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch port-to-go
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run go-port.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

  port-to-go:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history — needed to find the previous release commit

      - name: Find previous release point and build diff context
        id: diff
        run: |
          prev_sha=$(git log --skip=1 -n 1 --format=%H -- image:tag || true)
          if [ -z "$prev_sha" ]; then
            echo "No earlier image:tag commit found (first release) — diffing against the repo root."
            prev_sha=$(git rev-list --max-parents=0 HEAD)
          fi
          {
            echo "Previous release commit: $prev_sha"
            echo "Current release commit:  $(git rev-parse HEAD)"
            echo
            echo "### image:tag"
            git diff "$prev_sha"..HEAD -- image:tag
            echo
            echo "### flows.json"
            git diff "$prev_sha"..HEAD -- flows.json
            echo
            echo "### settings.js"
            git diff "$prev_sha"..HEAD -- settings.js
            echo
            echo "### wis2-notification-message.json"
            git diff "$prev_sha"..HEAD -- wis2-notification-message.json
            echo
            echo "### package.json"
            git diff "$prev_sha"..HEAD -- package.json
          } > /tmp/reference-diff.txt
          lt() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" = "$1" ]; }
          prev_tag=$(git show "$prev_sha:image:tag" 2>/dev/null | tr -d '[:space:]'); prev_tag=${prev_tag#*:}
          cur_tag=$(tr -d '[:space:]' < image:tag); cur_tag=${cur_tag#*:}
          go_ver=$(tr -d '[:space:]' < go/source/antiloop.version)
          prev_lower=n/a; [ -n "$prev_tag" ] && { lt "$prev_tag" "$go_ver" && prev_lower=yes || prev_lower=no; }
          cur_lower=no; action=USE_IMAGE_TAG
          if lt "$cur_tag" "$go_ver"; then cur_lower=yes; action=BUMP_INDEPENDENTLY; fi
          {
            echo
            echo "### Version check"
            echo "PREV_TAG=$prev_tag"
            echo "CUR_TAG=$cur_tag"
            echo "GO_VERSION=$go_ver"
            echo "PREV_LOWER_THAN_GO=$prev_lower"
            echo "CUR_LOWER_THAN_GO=$cur_lower"
            echo "ACTION=$action"
          } >> /tmp/reference-diff.txt
          echo "Diff written to /tmp/reference-diff.txt ($(wc -l < /tmp/reference-diff.txt) lines)"

      - name: Port changes with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            This repo's image:tag file was just bumped, marking a new
            release of the Node-RED reference implementation (flows.json,
            settings.js, wis2-notification-message.json, package.json).
            Read the current image:tag file yourself for the new version
            string, and read /tmp/reference-diff.txt for exactly what
            changed since the previous release.

            This repo also contains a Go reimplementation of the same
            relay under go/source/ (go/source/cmd/, go/source/internal/).
            go/deploy/ holds Ansible deployment tooling for that Go
            binary — leave it alone unless the diff specifically implies
            a new/changed env var or config shape that deploy/ templates
            would need to know about too. Your job: understand what
            functional change the diff represents, and make the
            equivalent change in the Go code under go/source/.

            Rules:
            - Do NOT modify flows.json, settings.js, wis2-notification-message.json,
              or package.json — those are the reference, read-only from here.
            - Do NOT build or containerize the Go binary — that happens in a
              separate workflow, after human review of your PR.
            - If a change has no Go-side equivalent (e.g. Node-RED-specific
              plumbing), say so explicitly in the PR description rather than
              guessing at a port.
            - If you're not confident a change was ported correctly, flag
              that in the PR description too instead of silently proceeding
              — this is a production WIS2 relay.
            - Versioning. /tmp/reference-diff.txt ends with a "### Version
              check" section, computed by the workflow (numeric, not
              string, comparison): PREV_TAG, CUR_TAG, GO_VERSION (the
              current go/source/antiloop.version), PREV_LOWER_THAN_GO,
              CUR_LOWER_THAN_GO and ACTION. Trust those values.
              Only if you changed code under go/source/:
                * ACTION=USE_IMAGE_TAG: write CUR_TAG (the image:tag value
                  without the "wis2gb:" prefix, e.g. 2026.9.1) as the one
                  plain line of go/source/antiloop.version. Do not bump or
                  alter it in any other way.
                * ACTION=BUMP_INDEPENDENTLY (image:tag is lower than
                  antiloop.version): do NOT use image:tag. Increment the
                  last numeric component of GO_VERSION by one
                  (2026.8.9 -> 2026.8.10) and write that.
                * In both cases add a matching "### <new version> — <date>"
                  entry under "Go releases" in go/CHANGELOG.md.
              If you made no Go source change (review-only PR), leave
              antiloop.version untouched so no release is built.
              Never touch go/deploy/shared/antiloop.version — that is the
              fleet promotion pointer, a separate human step.
              Highlight in the PR description, in a "Version warnings"
              section at the top: (a) if PREV_LOWER_THAN_GO=yes, that the
              previous image:tag was lower than antiloop.version, i.e.
              the Go version had run ahead of the flow release; (b) if
              ACTION=BUMP_INDEPENDENTLY, that image:tag is lower than
              antiloop.version, so antiloop.version was bumped on its own
              and is no longer aligned with image:tag. State the actual
              values. If neither applies, say the versions are in sync.
            - Always open a pull request against main, even if your
              conclusion is "no Go changes needed this release" — in that
              case open a PR that only notes the review in go/CHANGELOG.md,
              don't skip the PR silently.

            Create a branch named go-port/<the new image:tag value>,
            commit your changes, push it, and open the PR yourself with
            `gh pr create`.
          claude_args: '--allowedTools "Read,Write,Edit,Grep,Glob,Bash(git *),Bash(gh pr create*)" --max-turns 40'
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Go port run for a new image:tag release: ${{ job.status }}. Check pull requests: ${{ github.server_url }}/${{ github.repository }}/pulls"
            }
